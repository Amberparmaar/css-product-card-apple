<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- font awsome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- custom css -->
    <link rel="stylesheet" href="./style.css">
    <!-- medium screen -->
    <link rel="stylesheet" href="./medium.css" media="(max-width:600px)">
</head>

<body>
    <div class="wrapper">
        <div class="container">
            <div class="card-left">
                <i class="fa-solid fa-share-nodes share"></i>
                <i class="fa-regular fa-heart heart"></i>
                <img class="hero" src="./images/apple.png" alt="apple">
                <div class="apples">
                    <img src="./images/apple-whole.png" alt="apple-whole">
                    <img src="./images/half-apple.png" alt="half-apple">
                    <img src="./images/green-apple.png" alt="green-apple">
                    <img src="./images/apple-top.png" alt="top-apple">
                </div>
            </div>
            <div class="card-right">
                <h1>Delicious Apples</h1>
                <span>COD 45999</span>
                <p class="price">R$
                </p>
                <h2>7.93</h2>
                <br>
                <span>SELECT A COLOR</span>
                <div class="select">
                    <img style="border: 1px solid black;" src="./images/apple-whole.png" alt="apple-whole">
                    <img src="./images/apple-yellow.png" alt="apple-yellow">
                    <img src="./images/apple-real.png" alt="apple-real">
                    <img src="./images/apple-red.png" alt="apple-red">
                </div>
                <span>BENEFITS</span>
                <ul>
                    <li>Apples are nutritious</li>
                    <li>Apples may be good for weight loss</li>
                    <li>Apples may be good for bone health</li>
                    <li>They're linked to a lowest risk of diabeties</li>
                </ul>
                <button>ADD TO CART</button>
            </div>
        </div>
    </div>
</body>

</html>
